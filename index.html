<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Тоннели</title>
    <link rel="icon" href="data:," />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0d0f12;
        overflow: hidden;
        /* Отключаем жесты браузера: прокрутку, масштаб, выделение, «долгое нажатие» */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      #game { width: 100%; height: 100%; }
      /* Заглушка для портретной ориентации на телефоне */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0d0f12;
        color: #e6e1d3;
        font: 20px sans-serif;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Поверните телефон горизонтально ↻</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
